{{ define "main" }}
<div class="article-wrap">
  <a class="back-link" href="/projects/">← Projects</a>
  {{ with .Params.category }}
  <p class="article-eyebrow">{{ . }}</p>
  {{ end }}
  <h1>{{ .Title }}</h1>
  {{ with .Params.summary }}
  <p class="article-lead">{{ . }}</p>
  {{ end }}
  <div class="article-body">
    {{ .Content }}
  </div>
</div>
{{ end }}
