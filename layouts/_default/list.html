{{ define "main" }}
<section>
  <div class="section-inner">
    <h2 class="section-title">{{ .Title }}</h2>
    {{ if .Pages }}
    <ul class="post-list">
      {{ range .Pages.ByDate.Reverse }}
      <li class="post-item">
        <a href="{{ .Permalink }}">
          <div class="post-title">{{ .Title }}</div>
          <span class="post-date">{{ .Date.Format "Jan 2006" }}</span>
        </a>
      </li>
      {{ end }}
    </ul>
    {{ end }}
    {{ if .Content }}
    <div class="article-body" style="margin-top: 48px;">{{ .Content }}</div>
    {{ end }}
  </div>
</section>
{{ end }}
