{{ define "main" }}
<section>
  <div class="section-inner">
    <p class="section-eyebrow">Writing</p>
    <h2 class="section-title">Blog</h2>
    {{ if .Pages }}
    <ul class="post-list">
      {{ range .Pages.ByDate.Reverse }}
      <li class="post-item">
        <a href="{{ .Permalink }}">
          <div>
            <div class="post-title">{{ .Title }}</div>
            {{ with .Params.summary }}
            <div class="post-summary">{{ . }}</div>
            {{ end }}
          </div>
          <span class="post-date">{{ .Date.Format "Jan 2006" }}</span>
        </a>
      </li>
      {{ end }}
    </ul>
    {{ else }}
    <p style="color: var(--text-muted);">No posts yet.</p>
    {{ end }}
  </div>
</section>
{{ end }}
