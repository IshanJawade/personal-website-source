# LinkedIn posts shown on /posts
# ---------------------------------
# To add a post:
#   1. On LinkedIn, open the post → "..." menu → "Embed this post"
#   2. In the copied iframe's src (…/embed/feed/update/urn:li:share:XXXX),
#      copy everything from "urn:" onward into `urn` below.
#   3. Add a short title and the post date (YYYY-MM-DD). Newest shows first.
#
# The two samples below are real public LinkedIn posts, only so you can see
# how the section looks. Replace them with your own.

- title: "Sample embedded post"
  urn: "urn:li:share:6798694119458824192"
  date: "2021-05-13"

- title: "Another sample post"
  urn: "urn:li:share:6798694119458824192"
  date: "2021-05-10"
